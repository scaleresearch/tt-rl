name: Publish to PyPI

# Pushing a tag such as v0.1.0 builds the wheel and sdist and uploads them to
# PyPI through trusted publishing, so no API token is stored anywhere.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Build and upload
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Check the tag matches ttrl.__version__
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' ttrl/__init__.py)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match ttrl.__version__ $version"; exit 1; }

      - name: Build
        run: uv build

      - name: Upload
        uses: pypa/gh-action-pypi-publish@release/v1
